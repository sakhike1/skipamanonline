<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="THREADAI - Premium t-shirts with AI-inspired designs">
    <title>skipaman</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS to prevent white flash */
      html {
        margin: 0;
        padding: 0;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        overflow: hidden;
      }
      
      /* Hide loading screen once React app loads */
      .app-loaded #loading-screen {
        display: none !important;
      }
      
      /* Additional safety - hide loading screen after a short delay */
      #loading-screen {
        animation: fadeOut 0.1s ease-out 2s forwards;
      }
      
      @keyframes fadeOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      
      /* Animated background elements */
      #loading-screen::before {
        content: '';
        position: absolute;
        top: 25%;
        left: 25%;
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, rgba(147, 51, 234, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
        border-radius: 50%;
        filter: blur(60px);
        animation: float1 12s ease-in-out infinite;
      }
      
      #loading-screen::after {
        content: '';
        position: absolute;
        bottom: 25%;
        right: 25%;
        width: 192px;
        height: 192px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(34, 211, 238, 0.2) 100%);
        border-radius: 50%;
        filter: blur(60px);
        animation: float2 15s ease-in-out infinite 2s;
      }
      
      .loading-spinner {
        position: relative;
        width: 112px;
        height: 112px;
        margin-bottom: 3rem;
      }
      
      .spinner-ring {
        position: absolute;
        border-radius: 50%;
        border: 4px solid transparent;
      }
      
      .spinner-ring-1 {
        inset: 0;
        border-top-color: rgba(255, 255, 255, 0.1);
        animation: spin 4s linear infinite;
      }
      
      .spinner-ring-2 {
        inset: 8px;
        border-top-color: #8b5cf6;
        animation: spin 3s linear infinite reverse;
      }
      
      .spinner-ring-3 {
        inset: 16px;
        border-top-color: #ec4899;
        animation: spin 2s linear infinite;
      }
      
      .spinner-center {
        position: absolute;
        inset: 24px;
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
      }
      
      .brand-text {
        color: white;
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-align: center;
        margin-bottom: 1rem;
      }
      
      .brand-text .skipa {
        background: linear-gradient(90deg, #ffffff, #e5e7eb, #ffffff);
        background-size: 200% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 3s linear infinite;
      }
      
      .brand-text .man {
        background: linear-gradient(90deg, #fbbf24, #f97316, #fbbf24);
        background-size: 200% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 3s linear infinite 0.5s;
      }
      
      .loading-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1.125rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      .progress-bar {
        width: 320px;
        height: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        margin: 1.5rem 0;
        backdrop-filter: blur(4px);
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #8b5cf6, #ec4899, #8b5cf6);
        background-size: 200% 100%;
        border-radius: 9999px;
        animation: progress 3s ease-out forwards, shimmer 2s linear infinite;
      }
      
      .progress-text {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.875rem;
        font-family: 'Courier New', monospace;
        font-weight: 600;
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { 
          opacity: 1;
          transform: scale(1);
        }
        50% { 
          opacity: 0.8;
          transform: scale(1.05);
        }
      }
      
      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      
      @keyframes float1 {
        0%, 100% { 
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        33% { 
          transform: translate(100px, -60px) scale(1.3) rotate(180deg);
        }
        66% { 
          transform: translate(50px, -30px) scale(0.8) rotate(360deg);
        }
      }
      
      @keyframes float2 {
        0%, 100% { 
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        33% { 
          transform: translate(-80px, 80px) scale(0.8) rotate(-180deg);
        }
        66% { 
          transform: translate(-40px, 40px) scale(1.2) rotate(-360deg);
        }
      }
      
      @keyframes progress {
        0% { width: 0%; }
        100% { width: 95%; }
      }
      
      /* Particle effects */
      .particles {
        position: absolute;
        inset: 0;
        opacity: 0.3;
      }
      
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        animation: particle 3s infinite;
      }
      
      @keyframes particle {
        0%, 100% { 
          opacity: 0;
          transform: scale(0);
        }
        50% { 
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body class="font-['Inter',sans-serif] text-gray-800 bg-gray-50">
    <div id="loading-screen" style="display: none;">
      <!-- Particle effects -->
      <div class="particles">
        <div class="particle" style="left: 10%; top: 20%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; top: 60%; animation-delay: 0.5s;"></div>
        <div class="particle" style="left: 30%; top: 40%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 40%; top: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 50%; top: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 60%; top: 70%; animation-delay: 2.5s;"></div>
        <div class="particle" style="left: 70%; top: 50%; animation-delay: 0.3s;"></div>
        <div class="particle" style="left: 80%; top: 25%; animation-delay: 0.8s;"></div>
        <div class="particle" style="left: 90%; top: 65%; animation-delay: 1.3s;"></div>
        <div class="particle" style="left: 15%; top: 85%; animation-delay: 1.8s;"></div>
      </div>
      
      <!-- Enhanced spinner -->
      <div class="loading-spinner">
        <div class="spinner-ring spinner-ring-1"></div>
        <div class="spinner-ring spinner-ring-2"></div>
        <div class="spinner-ring spinner-ring-3"></div>
        <div class="spinner-center">
          <span style="color: white; font-size: 1.5rem; font-weight: 900;">S</span>
        </div>
      </div>
      
      <!-- Brand name -->
      <div class="brand-text">
        <span class="skipa">SKIPA</span><span class="man">MAN</span>
      </div>
      
      <!-- Loading text -->
      <div class="loading-text">Initializing...</div>
      
      <!-- Progress bar -->
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      
      <!-- Progress text -->
      <div class="progress-text">0%</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
